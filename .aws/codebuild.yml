version: 0.2

phases:
  pre_build:
    commands:
      - export BRANCH=$(echo "$CODEBUILD_SOURCE_VERSION" | cut -d "/" -f 2)
      - export REV=$(git rev-parse --short HEAD)
      - docker buildx version

  build:
    commands:
      # Enables docker cache, see https://aws.amazon.com/pt/blogs/devops/reduce-docker-image-build-time-on-aws-codebuild-using-amazon-ecr-as-a-remote-cache/
      - docker buildx create --name containerd --driver=docker-container --driver-opt default-load=true
      # Login to docker hub
      - echo $DOCKER_HUB_TOKEN | docker login --username crazyegg --password-stdin
      # Login to ECR
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      # Build with cache-to and cache-from options
      - |
        docker build \
        --cache-to type=registry,ref=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/localstack:cache,mode=max \
        --cache-from type=registry,ref=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/localstack:cache \
        --builder=containerd \
        --build-arg LOCALSTACK_BUILD_VERSION=$REV \
        --tag $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/localstack:$REV \
        --tag $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/localstack:latest \
        -f Dockerfile .

  post_build:
    commands:
      - echo Pushing docker image...
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/localstack:$REV
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/localstack:latest
